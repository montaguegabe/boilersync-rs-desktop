name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          path: boilersync-rs-desktop
      - name: Check out boilersync-rs (boilersync-core path dependency)
        uses: actions/checkout@v4
        with:
          repository: montaguegabe/boilersync-rs
          path: boilersync-rs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: boilersync-rs-desktop/pnpm-lock.yaml
      - name: Frontend
        working-directory: boilersync-rs-desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm build
      - name: Rust
        working-directory: boilersync-rs-desktop/src-tauri
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test
