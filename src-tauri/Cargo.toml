[package]
name = "boilersync-rs-desktop"
version = "0.1.0"
description = "Boilersync: scaffold projects from templates and review, commit and sync them"
authors = ["Gabe Montague"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name,
# which matters on Windows (https://github.com/rust-lang/cargo/issues/8519).
name = "boilersync_rs_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
boilersync-core = { path = "../../boilersync-rs/crates/boilersync-core" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
percent-encoding = "2"
url = "2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
